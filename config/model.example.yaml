# ==============================================================================
# Model Configuration Specification
# GLM-5.2 Mixture-of-Experts (MoE) Architecture Specification
# ==============================================================================

model:
  name: "GLM-5.2"
  full_parameter_count: "744B"
  active_parameter_count: "40B"
  architecture: "ChatGLM-MoE"
  
  # Quantization & Sharding
  quantization:
    scheme: "grouped-int4"
    group_size: 64
    format: "safetensors"
    has_mtp_head: true
    mtp_precision: "int8"
    minimum_colibri_version: "v1.5.0+"
    
  # Primary Hugging Face Repository
  repository:
    primary: "mastouri/GLM-5.2-colibri-int4-g64-with-int8-mtp"
    revision: "main"
    sha: "fd9b461ac7cae4b921470d0db12230c6505bd03c"
    reference_video_target: "annelo/GLM-5.2-FP8-Uncensored-Colibri-Int4"
    fallback_target: "jlnsrk/GLM-5.2-colibri-int4"
    
  # File Component Expectations (142 Total Safetensors Shards)
  files:
    metadata:
      - "config.json"
      - "generation_config.json"
    tokenizer:
      - "tokenizer.json"
      - "tokenizer_config.json"
    shards:
      pattern: "out-*.safetensors"
      total_shards: 142
      regular_shards: 141
      mtp_shards: 1
      mtp_file: "out-mtp-00000.safetensors"
      expected_total_bytes: 429276218793 # ~399.79 GiB / ~429.28 GB decimal
      
  # Generation defaults
  generation:
    max_tokens: 4096
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    repetition_penalty: 1.05
    stop_tokens:
      - "<|endoftext|>"
      - "<|user|>"
      - "<|observation|>"
